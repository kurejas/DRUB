<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<!-- home-screen app: square, full-bleed artwork (the phone rounds or masks the corners itself) -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">   <!-- Figma 56:3367 "Favicon", exported at 2x -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- from the home screen the page runs up under the status bar (no white band above it); --top keeps the corners clear -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DRUB">
<meta name="application-name" content="DRUB">
<title>DRUB</title>
<meta name="drub-build" content="20261023064437">
<script>
  // stale copies (GitHub Pages lets browsers keep a page 10 minutes; a home-screen app keeps its own): on launch, ask
  // the server for the current build without any cache, and if it is newer, reload once
  (() => {
    const mine = document.querySelector('meta[name="drub-build"]').content;
    if (mine === 'dev' || !/^https?:$/.test(location.protocol)) return;
    fetch(location.pathname + '?b=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => {
      const live = (t.match(/name="drub-build" content="([^"]+)"/) || [])[1];
      let tried = null; try { tried = sessionStorage.getItem('drub-reload'); } catch (_) {}
      if (live && live !== mine && tried !== live) { try { sessionStorage.setItem('drub-reload', live); } catch (_) {} location.reload(); }
    }).catch(() => {});
  })();
  // SF Pro: the installed variable font (designers' Macs), else the system font on Apple devices (it is SF Pro, with the
  // same width axis). Other platforms can't have SF Pro (its licence forbids serving it), so they get Archivo: a free
  // variable font whose wide end (125%) looks the most like SF Pro's extended cut; widths outside 62–125% are held at
  // its limits. ?font=fallback shows that fallback anywhere, SF Pro installed or not.
  (function () {
    // The other candidates tried for it, previewed anywhere with ?font=roboto, inter or intertight (Roboto Flex's width
    // runs 25–151%; Inter and Inter Tight have no width axis, so every letter keeps one width)
    var CAND = { roboto: 'Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000', inter: 'Inter:opsz,wght@14..32,100..900', intertight: 'Inter+Tight:wght@100..900' };
    var m = location.search.match(/[?&]font=(\w+)/), pick = m && CAND[m[1]] ? m[1] : null;
    var fallback = !!pick || /[?&]font=fallback\b/.test(location.search);
    var apple = !fallback && (/Mac|iPhone|iPad|iPod/.test(navigator.platform) || /Mac OS X|iPhone|iPad/.test(navigator.userAgent));
    document.documentElement.className = apple ? 'apple' : fallback ? 'other nosf' + (pick ? ' f-' + pick : '') : 'other';
    if (!apple) {
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=' + (pick ? CAND[pick] : 'Archivo:wdth,wght@62..125,100..900') + '&display=swap';
      document.head.appendChild(l);
    }
  })();
</script>
<style>
  @font-face {
    font-family: "SF Pro V";
    src: local("SFPro-Regular"), local("SF Pro Regular");
    font-weight: 1 1000;
    font-stretch: 30% 150%;
  }
  :root {
    --ink: #000000;
    --paper: #FFFFFF;
    --font: "SF Pro V", "Archivo", sans-serif;
    --ease: cubic-bezier(0.42, 0, 0.58, 1);   /* Figma's "ease in and out" */
  }
  html.apple { --font: "SF Pro V", system-ui, sans-serif; }
  html.nosf { --font: "Archivo", sans-serif; }
  html.f-roboto { --font: "Roboto Flex", sans-serif; }
  html.f-inter { --font: "Inter", sans-serif; } html.f-intertight { --font: "Inter Tight", sans-serif; }

  html.dark { --ink: #FFFFFF; --paper: #000000; }   /* step 2 and on: the page turns black */
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
}
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
         color: var(--ink); font-family: var(--font); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

  /* The stage is the Figma frame (402 × 874 on an iPhone 17): full height, up to 430 px wide, centred. Positions are the
     frame's, measured from the edge each element is pinned to: the top block from the top, the bar from the bottom,
     the shape from the middle. */
  .stage {
    /* full width (Figma's 874 × 1000 frames): the corner controls sit 40 px in from the window's corners on any screen;
       the figure, the names and the mode dots stay centred, and nothing scales up */
    /* pinned to the screen's edges rather than 100dvh: as a home-screen app (status bar see-through) iOS reports
       100dvh short, which left a gap at the bottom and moved everything placed from the height */
    position: fixed; inset: 0; margin: 0 auto; width: 100%; min-height: 480px;
    /* its own page colour: being fixed it is a layer of its own, and the names, icon, bubbles and knob blend by
       difference against what is in it; with no background they had nothing to invert (white on the white page) */
    background: var(--paper);
    --top: max(0px, env(safe-area-inset-top) - 20px);
    --bottom: max(0px, env(safe-area-inset-bottom) - 20px);
  }

  /* SF Pro, bold, set per letter on the width axis at optical size 28. Every text box is trimmed to cap height and
     baseline, so `top` is the cap line, exactly as in Figma. */
  .t { position: absolute; margin: 0; font-weight: 700; line-height: 1; white-space: nowrap; text-transform: uppercase;
       font-variation-settings: "wdth" var(--w, 150), "opsz" 28; }
  .t span { font-variation-settings: "wdth" var(--w, 100), "opsz" 28; }
  @supports (text-box: trim-both cap alphabetic) { .t { text-box: trim-both cap alphabetic; } }
  @supports not (text-box: trim-both cap alphabetic) {
    .t::before, .t::after { content: ""; display: table; }
    .t::before { margin-bottom: -0.151em; }
    .t::after { margin-top: -0.144em; }
  }

  /* top corners */
  .logo { position: absolute; left: 40px; top: calc(40px + var(--top)); width: 24px; height: 24px;
          cursor: pointer; z-index: 3; }
  .logo::before { content: ''; position: absolute; inset: -12px; }   /* a 48 px tap zone round the 24 px mark */
  .logo svg { display: block; overflow: visible; }
  /* help: the page-colour mode next to the logo (Figma "step 1." 89:3646): LIGHT, DARK or MIXED, 16 px, cap line 46.5,
     widest beside the logo and 25 narrower per letter away from it */
  .themehint { left: 71px; top: calc(46.5px + var(--top)); font-size: 16px; color: var(--ink); pointer-events: none;
               opacity: 0; }
  html.helpon .themehint { opacity: 1; }
  .help { top: calc(43.5px + var(--top)); right: 49.5px; transform: translateX(50%); font-size: 24px; }
  /* help is off by default: the ? as a 1 px outline, no fill (Figma 42:2930, inside border); filled once help exists */
  .help:not(.on) { color: transparent; -webkit-text-stroke: 1px var(--ink); }
  .help { cursor: pointer; z-index: 3; }
  .help::before { content: ''; position: absolute; inset: -14px -16px; }   /* a 48 px tap zone */
  /* Help on: every initial spells out its word (K → KICK). The added letters open out of the initial on the width
     axis, narrow to wide, and fold back when help goes off; in the Sequencer's tight columns they stay narrower */
  /* each word is set like the style names: widest in the middle (150), 25 narrower per letter outward (helpWord) */
  @property --lw { syntax: '<number>'; inherits: false; initial-value: 150; }
  /* clipped at the sides only (clip-path, not overflow: an overflow box sits on its bottom edge, which lifted the
     initial in Safari and cut the letters' tops and bottoms on iPhone) */
  /* help text appears and goes at once (no fade, Darius); the added letters open to their own width (a grid column
     from 0fr to 1fr) as their width axis morphs: the lettering animation stays */
  .t .more { display: inline-grid; grid-template-columns: 0fr; vertical-align: baseline; white-space: nowrap;
             clip-path: inset(-0.5em 0 -0.5em 0); transition: grid-template-columns 0.5s ease-in-out; }
  .t .more > .mi { min-width: 0; }
  .t .hl { --lw: var(--off, 150); font-variation-settings: "wdth" var(--lw), "opsz" 28; transition: --lw 0.5s ease-in-out; }
  .t .more .hl { --lw: 50; }
  html.helpon .t .more { grid-template-columns: 1fr; }
  html.helpon .t .hl { --lw: var(--on); }

  /* the style picker: its instrument, then the name between the fading neighbours */
  /* The sound-source switch: guitar = ACOUSTIC (the recordings), speaker = SYNTH, as v1's SYNTH/ACOUSTIC switch. It
     belongs to the kit, not to the styles. The tap zone is 64 px square round the 24 px icon. The speaker's cones
     move with the loop: the woofer with the kick, the tweeter with the snare and hat. The guitar follows the melody
     line: each note strums it (it tips 4° round its body, 5.75° on the bar's first beat, more for a chord) and pops one of its
     three white details by pitch (a chord pops all three). */
  .icon { position: absolute; left: 50%; top: calc(156px + var(--top)); transform: translate(-50%, -50%); z-index: 2; }   /* above the figure's square on short screens */
  .kit { width: 64px; height: 64px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center;
         -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .kit > * { grid-area: 1 / 1; display: block; }
  /* drawn white and blended by difference, like the style names: black on the white page, white on the black one, and
     still visible where a shape reaches up behind it on short screens. The speaker's asset is already white (black cones) */
  .kit { mix-blend-mode: difference; }
  .kit .speaker { overflow: visible; }
  .kit .guitar { overflow: visible; } .kit .gt { transform-origin: 6px 19px; }   /* tips round its body */
  .kit .tw { transform-origin: 8.624px 5.958px; } .kit .wf { transform-origin: 8.624px 14.683px; }
  .kit:not(.synth) .speaker, .kit.synth .guitar { visibility: hidden; }
  /* the switch morphs (Darius): the guitar's outline bends into the speaker's rounded rectangle (and back) while its
     three dots travel and grow into the two cones; .kmorph draws it all in between, the real icons wait hidden */
  .kit .kmorph { overflow: visible; visibility: hidden; }
  .kit.morphing .kmorph { visibility: visible; }
  .kit.morphing .speaker, .kit.morphing .guitar { visibility: hidden; }   /* .kmorph draws the body in between */
  html.dark .face, .kit .guitar { filter: invert(1); }   /* the black SF Symbols turn white on the black page */

  /* Style picker: the names on one line, the chosen one centred and set wide in the middle (width 150, 25 narrower
     per letter outward), its neighbours showing the three letters nearest it (40, 35, 30 outward) and fading out.
     The script lays the words out from a continuous position, so dragging, scrolling and tapping all move the same
     strip and every letter morphs between the two settings on the way. The band around the names takes the input. */
  /* The turning triangle's corners swing up past the names (to y ≈ 171), so the names are white with a difference
     blend, like the bubbles: black on the page, white where the triangle passes behind them. */
  .switch { position: absolute; left: 0; right: 0; top: calc(196px + var(--top)); height: 12px; z-index: 1;
            mix-blend-mode: difference; }
  .switch .t { left: 0; top: 6px; font-size: 16px; color: #fff; will-change: transform; }
  /* Safari draws a blended strip in a layer clipped to its box, and the box is only cap-height tall, so it cut the
     letters' tops and bottoms: both strips get 6 px of room above and below (the text stays where it was) */
  .switch, .tones { padding: 6px 0; margin-top: -6px; }
  .picker { position: absolute; left: 0; right: 0; top: calc(176px + var(--top)); height: 56px; touch-action: pan-y;
            z-index: 2; }
  .picker, .picker:active { cursor: ew-resize; }                 /* the same sideways cursor as the tempo and the key */

  /* The shape and its rhyme live in a 402 × 402 square centred on the screen (the frame's y 236–638), scaled down as a
     unit on short screens (--s, set below). The script drives both from the clock, as v1 did:
       the triangle turns a quarter clockwise on every beat and keeps going round (right, down, left, up per bar), springing
       into place; its flat side hugs the edge it faces, as in the two Figma states
       the four bubbles stay put; the one on the current beat swells to 24 px and the others shrink with distance
       (12, 6, 3), springing to their new sizes on every beat
     Bubbles are white with a difference blend: white over the triangle, black over the page, two-tone on its edge. */
  /* ONE SHAPE, as in v1: a single outline in the page's opposite colour that morphs between the screens (triangle on
     step 1, circle on step 2), with each screen's contents riding on it. The square is the page colour so the
     difference-blended bubbles have a backdrop; it scales down as a unit on short screens. */
  .figure { position: absolute; left: 50%; top: 50%; width: 402px; height: 402px; background: var(--paper);
            transform: translate(-50%, -50%) scale(var(--s, 1)); }
  .shape { position: absolute; inset: 0; overflow: visible; }
  .figure.idle .shape { cursor: pointer; }
  .shape path { fill: var(--ink); }
  .shape .gap { fill: var(--paper); }                         /* tape stop: the page showing between its two blocks */   /* colours switch instantly, on the beat, as in v1 */
  .bubbles { position: absolute; inset: 0; transform-origin: 201px 201px; }
  /* the start screen (Figma "step 1." 42:3232): before the first tap only the knob is out, and START sits on the
     triangle's centre, 16 px, each letter narrower than the last; it pinches away on the tap and comes back on a stop */
  /* only with help on (Darius), and only until the first play; it pinches in and out with help (helpAt) */
  .start { left: 201.5px; top: 201px; font-size: 16px; color: #fff; mix-blend-mode: difference; transform: translate(-50%, -50%);
           pointer-events: none; }
  .bub { position: absolute; top: 201px; left: 0; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%;
         background: #fff; mix-blend-mode: difference; will-change: transform; }

  /* Step 2, the pad (Figma "step 2."): a 322 px white circle, blurred and pulsing with the beat; K on the top half,
     S on the bottom, H in a 30 px disc at the centre with a 44 px tap zone. Around the rim the loop: 32 steps from
     12 o'clock clockwise (both bars at once; a one-bar loop shows twice), three rings per step (kick 12 px at r 143, snare 6 px at r 124, hat 3 px at r 109.5); a dot
     shows where that drum plays and pops as the beat passes. A tap draws its lane's ring and narrows its letter
     (Figma: K and H tapped; S the same way). The edge blurs with every kick (12 px, back to sharp in about half a second). */
  /* Bass (Figma "iPhone 17 - 24", 10:678, colours turned for the white page): the shape stretches to a 134 × 402 pill,
     black, blurred by the kick like the pad. v1's Bass: 11 notes from the bottom end's centre (y 335) to the top's
     (y 67), 26.8 px apart, ticks down the left (longer on 0, 5, 10), the sound's name at the top (tap it for the next),
     the note beside the knob; past either end the pill stretches like rubber. */
  .bass { position: absolute; inset: 0; color: var(--paper); touch-action: none; }
  .stage:not([data-mode="3"]) .bass { pointer-events: none; }
  /* the note column (Figma "iPhone 17 - 37" at rest, "- 41" pushed to the top): a dot level with each note the knob can
     land on, 53 px left of it; 2 px at rest, swelling toward the knob as soon as it is pushed off the middle
     (12 px level with it, 6 either side, then 5, 4 … down to the resting 2) */
  .bass .bar { position: absolute; left: 148px; border-radius: 50%; background: var(--paper); transform: translate(-50%, -50%); }
  .bass .tick { position: absolute; left: 146px; height: 1.5px; margin-top: -0.75px; background: #fff; }
  .bass .t { font-size: 11px; }
  /* the bass sound's name (SUB, ACID, GROWL, UPRIGHT): help only (Figma "iPhone 17 - 24" 89:3334), 16 px, centred on the
     knob 35.5 px above the top note, riding up with an overdrag; set like the style names; tap it for the next sound */
  .bass .tone { left: 201px; transform: translate(-50%, -50%); cursor: pointer; font-size: 16px; opacity: 0;
                pointer-events: none; }
  html.helpon .bass .tone { opacity: 1; pointer-events: auto; }
  .bass .note { left: 232px; transform: translateY(-50%); font-size: 12px; }
  .bass .note2 { left: 160px; transform: translate(-50%, -50%); font-size: 9px; }
  .bass .dot2 { position: absolute; left: 201px; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
                background: #fff; mix-blend-mode: difference; }
  .bass .acc { text-transform: none; font-size: 0.7em; }
  .bass .tick, .bass .note2 { display: none; }              /* no ticks (Darius) */
  /* the note beside the knob (Figma 56:3504): 16 px, the letter at width 150, the rest at 125, 7 px right of the knob */
  .bass .note { left: 220px; font-size: 16px; }
  /* Filter (Figma "iPhone 17 - 30", 56:3377): a black 402 px square, edge to edge, and a 5 × 5 field of dots that
     shrink from left to right (8, 6, 4, 2, 1 px: big on the low-pass side, gone on the high-pass side), on an even
     70 px grid round the centre. v1's Filter: drag the knob, it stays where let go; a double-tap glides it home. */
  .filt { position: absolute; inset: 0; touch-action: none; }
  .stage:not([data-mode="4"]) .filt { pointer-events: none; }
  .filt i { position: absolute; border-radius: 50%; background: var(--paper); }
  /* Figma's letters take the place of four dots: R (resonance) top centre, L (low-pass) and H (high-pass) mid left
     and right, X bottom centre in outline only; 16 px bold, width 150, centred on their grid points */
  .filt .t { font-size: 16px; color: var(--paper); transform: translate(-50%, -50%); pointer-events: none; }
  /* X is now plain, like R, L and H (Darius: no outline) */
  /* Sequencer (Figma "iPhone 17 - 29", 56:4032): a full-width black band (y 1 … 514 of the figure), five columns: D
     (the kick), S, a thin track the knob rides down, H, M (melody). All 32 steps on screen, no 1 / 2 pages
     (Darius): rows 72 … 483, 13.3 px apart (more on tall screens). The band is an octagon (Figma's update). While it plays: a comet tail behind the playhead, and each line's column shivers
     when it plays; the band itself keeps still. On: 8 px (Darius; Figma had 12); off: a 2 px speck. A muted line goes to outline (Figma's D), its specks unchanged.
     v1's Sequencer: tap a step to toggle it, tap a letter to mute its line. Up top the style picker moves to the left
     half and the melody's sound picker takes the right (PLUCK …). */
  .seq { position: absolute; inset: 0; color: var(--paper); touch-action: none; }
  .stage:not([data-mode="2"]) .seq { pointer-events: none; }
  .seq i { position: absolute; border-radius: 50%; background: var(--paper); will-change: transform; }
  .seq i.o { background: none; box-shadow: inset 0 0 0 1px var(--paper); }
  .seq .t { font-size: 16px; transform: translate(-50%, -50%); top: 38px; cursor: pointer; }
  /* the melody's letter names its sound (Figma 67:1271): "M—" small and narrow, then the sound's initial, M—P for Pluck */
  .seq .t .mdash { font-size: 0.8em; --w: 50; }
  /* a muted line (Figma's "D" frame shows one): its letter and its steps in outline; its specks unchanged */
  .seq .t.mute { color: var(--ink); -webkit-text-stroke: 2px var(--paper); paint-order: stroke fill; }
  /* (the split itself glides with the band: see topSplit) */
  .tones { position: absolute; left: calc(50% + 24px); right: calc(50% - 154px); top: calc(196px + var(--top)); height: 12px; z-index: 1; mix-blend-mode: difference; }
  .tones .t { top: 6px; font-size: 16px; color: #fff; }
  .tpick { position: absolute; left: calc(50% + 24px); right: calc(50% - 154px); top: calc(176px + var(--top)); height: 56px; z-index: 2; cursor: ew-resize; touch-action: pan-y; }
  .tones { opacity: 0; } .tpick { pointer-events: none; }
  .pad { position: absolute; left: 40px; top: 40px; width: 322px; height: 322px; touch-action: none; cursor: pointer; }
  .stage:not([data-mode="1"]) .pad { pointer-events: none; }
  .pad > div { position: absolute; inset: 0; }
  .pad .dot { position: absolute; left: 161px; top: 161px; border-radius: 50%; will-change: transform; }
  /* K, H, S: 20 px letters (cap lines at 92.5, 154, 216); a letter drops to 16 px while it is tapped, and H also while
     the knob rests in the middle (an empty step: Figma's "no K-H-S"), where it shows white inside the knob */
  .pad .lbl { position: absolute; left: 161px; transform: translateX(-50%); font-size: 20px; }
  .pad .lbl.k { top: 92.5px; }  .pad .lbl.h { top: 154px; }  .pad .lbl.s { top: 216px; }
  .pad .lbl.small { font-size: 16px; }
  /* help: HOLD TO CLEAR under the pad (Figma "step 2." 85:3077), 16 px, set like the style names (wordWidths) */
  .pad .padhint { position: absolute; left: 161px; top: 362px; transform: translateX(-50%); font-size: 16px; color: var(--ink);
                  pointer-events: none; opacity: 0; }
  html.helpon .stage.can-clear .pad .padhint { opacity: 1; }   /* only when holding would clear something (helpState) */
  /* help: DOUBLE-TAP TO RESET where a double tap resets (the Sequencer: the pattern, sound and tempo; the Filter: back to
     the middle), placed by placeHints() as the shapes resize */
  .figure .dthint { position: absolute; left: 201px; transform: translate(-50%, -50%); font-size: 16px; pointer-events: none;
                    opacity: 0; z-index: 2; }
  .figure .dthint.seq-h { color: var(--ink); }              /* on the page, under the band's bottom tip */
  .figure .dthint.filt-h { color: var(--paper); }           /* in the square, bottom middle: RESONANCE's mirror */
  .figure .dthint.tape-h { color: var(--ink); }
  /* help, first screen: SWIPE → / PRESS → under the triangle (where Figma "step 1." 89:3966 has GO →), a button to the next screen (tap, click,
     or the → key / a swipe as ever) */
  .figure .dthint.go-h { color: var(--ink); cursor: pointer; }
  html.helpon .stage[data-mode="0"].can-go .dthint.go-h { opacity: 1; pointer-events: auto; }   /* not while START shows */
  .figure .dthint.go-h::before { content: ''; position: absolute; inset: -14px -20px; }   /* a bigger tap zone */
  /* touch screens (phones, tablets) say SWIPE →; a mouse and keyboard, PRESS → (the arrow key) */
  .go-h .go-touch { display: none; }
  @media (hover: none) and (pointer: coarse) { .go-h .go-touch { display: inline; } .go-h .go-keys { display: none; } }            /* on the page, under the blocks: HOLD (the tape stop) */
  /* each only when doing it would change something (helpState): a reset when not at the defaults, a hold while it plays */
  html.helpon .stage[data-mode="2"].can-seq .dthint.seq-h, html.helpon .stage[data-mode="4"].can-filt .dthint.filt-h,
  html.helpon .stage[data-mode="5"].can-hold .dthint.tape-h { opacity: 1; }
  .pad .lbl.narrow { --w: 50; } .pad .lbl.narrow .hl { --lw: 50; }                                /* tapped: same size, narrowed on the width axis (Figma) */
  .pad .lbl.k.small { top: 93.9px; }  .pad .lbl.h.small { top: 155.4px; }  .pad .lbl.s.small { top: 217.4px; }
  .pad .base .dot { background: var(--paper); }
  .pad .base .lbl { color: var(--paper); }
  /* a tap draws its lane's ring for 100 ms: a black band through that lane's dots, as wide as they are
     (kick 12 px at r 143, snare 6 px at r 124, hat 3 px at r 109.5), and its letter narrows to width 50 */
  .pad .ring { position: absolute; left: 50%; top: 50%; box-sizing: border-box; border: solid var(--paper); border-radius: 50%;
               transform: translate(-50%, -50%); visibility: hidden; }
  .pad .ring.k { width: 298px; height: 298px; border-width: 12px; }
  .pad .ring.s { width: 254px; height: 254px; border-width: 6px; }
  .pad .ring.h { width: 222px; height: 222px; border-width: 3px; }

  /* The knob, as in v1: one small circle that always exists and travels between jobs: the beat bubble on step 1, the
     current step's dot on the pad (kick, then hat, then snare), and the current mode dot while the screen changes.
     White with a difference blend: white over the shape, black over the page. */
  .knob { position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 999px;   /* sized live: a pill on its trips */
          background: #fff; mix-blend-mode: difference; z-index: 1; pointer-events: none; will-change: transform; }
  .knob.solid { background: var(--paper); mix-blend-mode: normal; }   /* the page colour: on the pad, the shape's opposite */

  /* bottom bar: tempo, the mode dots, key */
  .bpm { left: 60.5px; bottom: calc(40px + var(--bottom)); transform: translateX(-50%); font-size: 20px; }
  /* tempo bars above it (Figma "Frame 5", 40 × 40 at 40, 780): four 4 px bars; they spring to a new arrangement on
     every 16th note, full height on the beat */
  .bars { position: absolute; left: 40px; bottom: calc(54px + var(--bottom)); width: 40px; height: 40px; }
  /* the tempo zone over the bars and the number: drag sideways (or up), scroll, or tap for the next common tempo */
  .tempo { position: absolute; left: 24px; bottom: calc(24px + var(--bottom)); width: 76px; height: 86px; z-index: 2;
           cursor: ew-resize; touch-action: none; }
  .bars i { position: absolute; top: 20px; width: 4px; height: 24px; border-radius: 100px;   /* height set live, never scaled: */
            background: var(--ink); transform: translateY(-50%); }   /* ends stay round */
  .dots { position: absolute; left: 50%; bottom: calc(40px + var(--bottom)); width: 134px; height: 14px; transform: translateX(-50%);
          display: flex; align-items: center; justify-content: space-between; }
  .dots i { display: block; background: var(--ink); border-radius: 100px; width: var(--d); height: var(--d);
            transition: width 300ms var(--ease), height 300ms var(--ease); }
  .modes { position: absolute; left: 50%; bottom: calc(25px + var(--bottom)); width: 170px; height: 44px; transform: translateX(-50%);
           cursor: pointer; z-index: 2; }
  .key { right: 64.5px; bottom: calc(40px + var(--bottom)); font-size: 20px; }
  .face { position: absolute; right: 39.19px; bottom: calc(36.74px + var(--bottom)); width: 20.635px; height: 20.625px; }
  /* The key, as v1's: tap for major / minor (the face smiles or frowns), drag sideways to change the note (26 px per
     semitone past an 8 px dead zone). The mouth turns over through a flat line, with a blink as it passes flat; the
     letter pinches narrow, swaps, and widens back. */
  .face-svg { display: block; overflow: visible; }
  .face .mouth { transform-origin: 10.32px 13.805px; } .face .eyes { transform-origin: 10.32px 8.11px; }
  .key .acc { text-transform: none; font-size: 0.62em; margin-left: 0.04em; }
  .keyzone { position: absolute; right: 24px; bottom: calc(24px + var(--bottom)); width: 96px; height: 54px; z-index: 2;
             cursor: ew-resize; touch-action: none; }

<script>
  // Fit: the square shrinks on short screens so the turned triangle (402 tall) never meets the style picker.
  const stage = document.querySelector('.stage'), fig = document.querySelector('.figure');
  // a label's initial, then the rest of its word folded away until help is on; each letter's width when spelled out
  // follows the style names: 150 in the middle of the word, 25 less per letter outward
  // (top: the middle letter's width; the Sequencer's columns are 59 px apart, so its words are set 50 narrower)
  // Darius's steps, as in Figma: 150 at the middle letter (both middle letters of an even word), then 125, 100, 75, 50, 30
  const WSTEP = [150, 125, 100, 75, 50, 30];
  const wordWidths = (w, top = 150) => { const mid = (w.length - 1) / 2, sh = Math.round((150 - top) / 25);
    return [...w].map((c, i) => WSTEP[Math.min(5, Math.floor(Math.abs(i - mid)) + sh)]); };
  const helpWord = (w, top = 150) => {
    const ws = wordWidths(w, top);
    const sp = i => `<span class="hl" style="--on: ${ws[i]}">${w[i]}</span>`;
    return sp(0) + `<span class="more"><span class="mi">${[...w].slice(1).map((_, i) => sp(i + 1)).join('')}</span></span>`;
  };
  document.querySelector('.help').addEventListener('click', e => {
    const on = document.documentElement.classList.toggle('helpon'); e.currentTarget.classList.toggle('on', on);
    helpAnim = { on, t0: now(), k0: helpKnob(), s0: helpAt() };
  });
  var midUndo = null;                                          // set by a press in the middle, undone if it was a swipe
  // a tap, not a swipe (Darius): it fires on the lift, only if the finger stayed within 12 px and 0.6 s, so a sideways
  // swipe over the middle changes screen without also playing, toggling or muting
  function onTap(el, fn) {
    let d = null;
    el.addEventListener('pointerdown', e => { d = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() }; });
    el.addEventListener('pointerup', e => {
      const q = d; d = null; if (!q || e.pointerId !== q.id) return;
      if (Math.hypot(e.clientX - q.x, e.clientY - q.y) < 12 && performance.now() - q.t < 600) fn(e);
    });
    el.addEventListener('pointercancel', () => { d = null; });
  }
  // a double tap (two taps within 0.35 s and 30 px) resets a control to the style's default (Darius); the two single
  // taps still act on the way, and the reset lands on top of them
  function onDoubleTap(el, fn) {
    let last = null;
    onTap(el, e => {
      const t = performance.now();
      if (last && t - last.t < 350 && Math.hypot(e.clientX - last.x, e.clientY - last.y) < 30) { last = null; fn(e); }
      else last = { t, x: e.clientX, y: e.clientY };
    });
  }
  // no zooming on phones: double-tap is off via touch-action, pinch is stopped here (Safari ignores user-scalable=no)
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });

  // 1.2 s regardless (no audio, or blocked), so beat 1's sound and picture land together
  let waitStart = 0;
  // ready to play in time; or no engine at all (it failed to load, or no AudioContext), when waiting would only delay
  const audioOk = () => MUTE || AU.failed || !(window.AudioContext || window.webkitAudioContext) ||
    (AU.ready && AU.ctx && AU.ctx.state === 'running' && AU.anchored);
  function start() {
    if (playing) return;
    audioStart();
    if (!audioOk()) { waitStart = waitStart || now(); return; }
    waitStart = 0; doStart();
  }
  function doStart() {
    if (settle) { const n = Math.floor(seg.b0); rotOff = mod(rotOff + (n === 0 ? 0 : 90 * n), 360); settle = null; }   // its resting angle
    tape = null;
    playing = true; playT = now(); if (!firstPlayT) firstPlayT = playT; seg = { t0: playT, b0: 0, bps: seg.bps }; fig.classList.remove('idle');
    setIdle(0, playT);
    resync(playT);                                             // the loop starts over from its first 16th
  }
  // a second tap stops: the clock stands still, nothing more is sent, and what was sent ahead is dropped (tails ring out)
  function stop() {
    const t = now();
    const b = beats(t), n = Math.floor(b);
    settle = { t, tau: (b - n) / seg.bps };
    stopX = X[mod(n, 4)];                                     // the bubbles fly into the knob here
    barStop = { t, h: barEls.map(el => parseFloat(el.style.height) || 4) };   // the tempo bars shrink from where they were
    setIdle(1, t); seg = { t0: t, b0: b, bps: seg.bps }; playing = false; fig.classList.add('idle'); tape = null;
    if (AU.ready && AU.anchored) for (const v of [1, 2]) AU.node[v].port.postMessage({ cancelGrid: toFrame(t) });
  }
  onTap(fig, e => {
    if (mode !== 0 || morph > 0.1) return;
    const r = fig.getBoundingClientRect(), sc = r.width / 402, x = (e.clientX - r.left) / sc, y = (e.clientY - r.top) / sc;
    const V = triVerts(), side = (p, q) => (q[0] - p[0]) * (y - p[1]) - (q[1] - p[1]) * (x - p[0]);
    const s0 = side(V[0], V[1]), s1 = side(V[1], V[2]), s2 = side(V[2], V[0]);
    if ((s0 >= 0 && s1 >= 0 && s2 >= 0) || (s0 <= 0 && s1 <= 0 && s2 <= 0)) { if (playing) stop(); else if (waitStart) waitStart = 0; else start(); }
  });
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') stepMode(1); else if (e.key === 'ArrowLeft') stepMode(-1);
    else if (mode === 1 && /^[jkl]$/i.test(e.key)) hit({ j: 1, k: 2, l: 3 }[e.key.toLowerCase()], now());
  });
  let swipe = null;
  stage.addEventListener('pointerdown', e => { if (e.target === stage) swipe = { x: e.clientX, y: e.clientY }; });
  // a quick sideways flick over the middle (the shape and its controls) changes screen too; whatever the touch did there
  // on the way down (a step toggled, the filter knob moved, a dot taken out) is put back (midUndo)
  let midSwipe = null;
  stage.addEventListener('pointerdown', e => {
    midUndo = null; midSwipe = fig.contains(e.target) ? { id: e.pointerId, x: e.clientX, y: e.clientY, t: now() } : null;
  }, true);
  stage.addEventListener('pointerup', e => {
    const m = midSwipe; if (!m || e.pointerId !== m.id) return; midSwipe = null;
    const dx = e.clientX - m.x, dy = e.clientY - m.y;
    if (now() - m.t < 0.45 && Math.abs(dx) > 50 && Math.abs(dx) > 2 * Math.abs(dy)) {
      if (midUndo) midUndo(); midUndo = null; stepMode(dx < 0 ? 1 : -1);
    }
  });
  stage.addEventListener('pointerup', e => {
    if (!swipe) return; const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > 1.5 * Math.abs(dy)) stepMode(dx < 0 ? 1 : -1);
  });
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // each style's defaults, as loaded, for the double-tap resets: the tempo, the melody's sound, the beat and the melody
  const DEF = STYLES.map(st => { const sy = SOUND[st.name]; return { bpm: st.bpm, tones: { ...sy.tones }, m: [...sy.m] }; });
  onDoubleTap(tempoEl, () => { setBpm(DEF[shown].bpm); tick(660, 0.5); });
  const KEY0 = { root: key.root, scale: key.scale };          // the key as it loads (A minor)
  onDoubleTap(keyZone, () => { setKey(KEY0.root, KEY0.scale); tick(660, 0.5); });
  onDoubleTap(tpick, () => {
    const sy = snd(), d = DEF[shown].tones; sy.tones.mel = d.mel; sy.tones.smel = d.smel;
    toneGo(toneIdx()); resync(); tick(660, 0.5);
  });
  // the Sequencer resets on a double tap anywhere on the band (its drawn shape, tips included) except on the letter
  // and dot columns, where taps toggle steps and mutes (Darius)
  onDoubleTap(fig, e => {
    if (mode !== 2 || bandA < 0.9) return;
    const r = fig.getBoundingClientRect(), sc = r.width / 402, x = (e.clientX - r.left) / sc, y = (e.clientY - r.top) / sc;
    if (SEQ_X.some(lx => Math.abs(x - lx) < 26)) return;
    const dx = x - 201, dy = y - 201, dl = Math.hypot(dx, dy) || 1;
    if (dl > rayHit(201, 201, dx / dl, dy / dl, OCT)) return;    // off the band
    const st = STYLES[shown], sy = snd();
    loops[shown][1] = [...st.k].map(Number); loops[shown][2] = [...st.s].map(Number); loops[shown][3] = [...st.h].map(Number);
    sy.m.splice(0, sy.m.length, ...DEF[shown].m); muted.fill(false);
    // and the style's own sound and tempo (Darius): everything as it first loads
    sy.tones.mel = DEF[shown].tones.mel; sy.tones.smel = DEF[shown].tones.smel; toneGo(toneIdx());
    setBpm(DEF[shown].bpm);
    resync(); tick(660, 0.5);
  });
  // First visit hints (Darius: people don't see that the styles scroll and the icon switches): ~1 s in, unless that
  // control itself has been touched (other taps don't count), the style strip slides a third of the way to the next style and springs back, and the icon half-morphs
  // to the other kit and back. On every visit; only a use of that control during this visit skips its hint.
  const usedNow = {}, used = k => !!usedNow[k], markUsed = k => { usedNow[k] = true; };
  picker.addEventListener('pointerdown', () => markUsed('style')); kitBtn.addEventListener('click', () => markUsed('kit'));
  let stripPeek = null;
  picker.addEventListener('pointerdown', () => { if (stripPeek) { pos = stripPeek.base; stripPeek = null; } }, true);
  setTimeout(() => { if (!used('style') && !anim) stripPeek = { t0: now(), base: pos }; }, 1000);
  setTimeout(() => {
    if (used('kit') || snd().kitLock != null || kitBtn.classList.contains('morphing')) return;
    const syn = !kitNow(), ez = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
    kitMorph(syn, u => { const h = 0.5 * Math.sin(Math.PI * ez(u)); return syn ? 1 - h : h; }, 900);
  }, 2100);
  setMode(0); applyMode(0, 0); pending = null;
  if (Q.has('helpdemo')) setTimeout(() => document.querySelector('.help').click(), 1500);   // testing: help on by itself

  let lastPos = null;
  // which help hints would do something right now (Darius: a hint shows only when its action would change things)
  function helpState(t) {
    if (!document.documentElement.classList.contains('helpon')) return;
    const L = loops[shown], st = STYLES[shown], sy = snd(), d = DEF[shown];
    const padHas = [1, 2, 3].some(l => L[l].some(Boolean));
    const lane = (l, src) => L[l].some((v, i) => v !== +src[i % src.length]);
    const seqOff = lane(1, st.k) || lane(2, st.s) || lane(3, st.h) || sy.m.some((v, i) => v !== d.m[i]) || muted.some(Boolean) ||
      sy.tones.mel !== d.tones.mel || sy.tones.smel !== d.tones.smel || Math.abs(st.bpm - d.bpm) > 0.5;
    const fp = filtPos(t), filtOff = Math.hypot(fp.x - 0.5, fp.y - 0.5) > 0.02;
    stage.classList.toggle('can-clear', padHas); stage.classList.toggle('can-seq', seqOff);
    stage.classList.toggle('can-filt', filtOff); stage.classList.toggle('can-go', !!firstPlayT); stage.classList.toggle('can-hold', playing && !tapeOn(t) && tapePtr == null);
  }
  function frame() {
    const t = now();
    helpState(t);
    if (anim) { pos = anim.from + (anim.to - anim.from) * S(t - anim.t0, still ? 1e3 : 16); if (t - anim.t0 > 0.8) { pos = anim.to; anim = null; } }
    else if (stripPeek) {                                    // the first-visit peek: nearly halfway on, back, a little past
      const u = (t - stripPeek.t0) / 0.8;                    // and settle (0.8 s out and back, 0.3 s of overshoot)
      if (u >= 1.375) { pos = stripPeek.base; stripPeek = null; }
      else pos = stripPeek.base + (u < 1 ? 0.45 * Math.sin(Math.PI * u) : -0.09 * Math.sin(Math.PI * (u - 1) / 0.375));
    }
    if (pos !== lastPos) { layoutStrip(); lastPos = pos; }
    if (pending && t >= pending.t) { applyMode(pending.mode, pending.t); pending = null; }
    if (tape && tape.tR != null && t > tape.tR + 1.5) tape = null;   // a finished tape stop, settled: forget it
    if (!still || lastPos === null) { rhyme(t); bars(t); }
    pump(); filtSend(t);
    if (waitStart && (audioOk() || t - waitStart > 1.2)) { waitStart = 0; doStart(); }   // the sound is ready: go
    if (!playing && !waitStart && idleAnim.to === 0) setIdle(1, t);   // a start that never came: the blocks wind back down
    if (!still) { if (kitNow()) guitarRender(t); else speakerRender(t); }
    keyRender(still ? t + 9 : t);
    shapeRender(t);
    if (morph > 0.5) padRender(t);
    knobRender(t);
    requestAnimationFrame(frame);
  }
  choose(FIRST);
  setTimeout(audioInit, 0);                                   // build the audio engine now, so the first tap starts at once
  document.fonts.ready.then(() => { lastPos = null; });       // re-measure once SF Pro is in
  frame();
</script>
